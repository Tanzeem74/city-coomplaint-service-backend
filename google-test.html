<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google Login Test</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <h2>City Complaint - Google Login Test</h2>

    <div
      id="g_id_onload"
      data-client_id="952075945868-0ksvmp07gk602vg742if17o204h4rthc.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
    ></div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular"
    ></div>

    <script>
      function handleCredentialResponse(response) {
        console.log("Google ID Token:");
        console.log(response.credential);

        document.body.insertAdjacentHTML(
          "beforeend",
          `<p>Login successful. Check browser console for ID token.</p>`,
        );
      }
    </script>
  </body>
</html>
